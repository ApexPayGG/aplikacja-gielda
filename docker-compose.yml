version: "3.9"

services:
  timescaledb:
    image: postgres:15-alpine
    container_name: stockai-timescaledb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stockai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: node:20-alpine
    container_name: stockai-api
    working_dir: /app
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@timescaledb:5432/stockai}
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./apps/api:/app
    ports:
      - "3000:3000"
    depends_on:
      - timescaledb
    restart: unless-stopped

volumes:
  postgres_data:

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: ${COMPOSE_PROJECT_NAME:-stockai}-timescaledb
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stockai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-stockai}-redis
    env_file:
      - .env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    depends_on:
      - timescaledb

  adminer:
    image: adminer:latest
    container_name: ${COMPOSE_PROJECT_NAME:-stockai}-adminer
    env_file:
      - .env
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: timescaledb
    depends_on:
      - timescaledb
      - redis

volumes:
  postgres_data:
  redis_data:

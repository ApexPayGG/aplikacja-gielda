<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>StockAI Pro — Next-generation investing platform</title>
    <meta
      name="description"
      content="StockAI Pro — Next-generation global investment platform powered by AI market intelligence and behavioral coaching."
    />
    <meta property="og:title" content="StockAI Pro — Next-generation investing platform" />
    <meta
      property="og:description"
      content="StockAI Pro — Next-generation global investment platform powered by AI market intelligence and behavioral coaching."
    />
    <meta property="og:image" content="https://stock-ai.pro/logo.png" />
    <meta property="og:url" content="https://stock-ai.pro/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StockAI Pro — Next-generation investing platform" />
    <meta
      name="twitter:description"
      content="StockAI Pro — Next-generation global investment platform powered by AI market intelligence and behavioral coaching."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "StockAI Pro",
        "applicationCategory": "FinanceApplication",
        "offers": { "@type": "Offer", "price": "9", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          if (window.__stockaiSwRegistered || window.__stockaiSwRegistrationStarted) {
            return;
          }

          window.__stockaiSwRegistrationStarted = true;
          navigator.serviceWorker
            .register("/sw.js")
            .then(function () {
              window.__stockaiSwRegistered = true;
            })
            .catch(function (error) {
              window.__stockaiSwRegistrationStarted = false;
              console.error("Service worker registration failed:", error);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
